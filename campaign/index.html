<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M18 18h28v6H18zm0 11h18v6H18zm0 11h28v6H18z' fill='%23fffaf0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
    <title>Brief30 Campaign Kit</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <nav>
          <strong>Brief30 campaign</strong>
          <a href="../outbox/index.html">Outbox</a>
          <a href="../operator/index.html">Operator</a>
        </nav>
        <section class="heroGrid">
          <div>
            <p class="eyebrow" id="mathEyebrow">팀 스프린트 1건</p>
            <h1>오늘 보낼 문안을 바로 뽑습니다</h1>
            <p id="mathIntro">월 30은 팀 스프린트 1건입니다. 매일 10명에게 proof와 주문 링크가 들어간 문안을 보냅니다.</p>
          </div>
          <aside class="mathBox">
            <span>오늘 목표</span>
            <strong>10 DMs</strong>
            <p id="mathDetail">1건 x 300,000원 = 300,000원</p>
          </aside>
        </section>
      </header>

      <section class="workspace">
        <form class="panel controlPanel" id="campaignForm">
          <div class="sectionHeader">
            <p class="eyebrow">Message inputs</p>
            <h2>대상과 오퍼</h2>
          </div>
          <label>
            <span>이름/호칭</span>
            <input name="name" value="OO님" />
          </label>
          <label>
            <span>세그먼트</span>
            <select name="segment">
              <option value="office">직장인/PM</option>
              <option value="freelancer">프리랜서</option>
              <option value="agency">에이전시</option>
              <option value="founder">창업자</option>
              <option value="consultant">컨설턴트</option>
            </select>
          </label>
          <label>
            <span>반복 고통</span>
            <input name="pain" value="주간보고와 회의록 정리" />
          </label>
          <label>
            <span>제안 오퍼</span>
            <select name="offer">
              <option value="team">300,000원 팀 브리핑 스프린트</option>
              <option value="setup">49,000원 셋업팩</option>
              <option value="self">19,000원 셀프툴</option>
              <option value="service">99,000원 대행팩</option>
            </select>
          </label>
          <label>
            <span>Diagnostic/Proof URL</span>
            <input name="proof" value="../diagnostic/index.html" />
          </label>
          <label>
            <span>Order URL</span>
            <input name="order" value="../order/index.html?offer=team" />
          </label>
        </form>

        <section class="panel outputPanel">
          <div class="sectionHeader">
            <p class="eyebrow">Copy queue</p>
            <h2>5개 문안</h2>
          </div>
          <div class="messageGrid" id="messageGrid"></div>
          <div class="buttonRow">
            <button class="primary" id="copyAll" type="button">전체 복사</button>
            <button class="secondary" id="downloadTxt" type="button">TXT 저장</button>
          </div>
        </section>
      </section>

      <section class="panel cadencePanel">
        <p class="eyebrow">Daily cadence</p>
        <div class="cadenceGrid">
          <article><strong>10</strong><span>새 DM</span></article>
          <article><strong>5</strong><span>후속 연락</span></article>
          <article><strong>2</strong><span>데모 요청</span></article>
          <article><strong>1</strong><span>결제 요청</span></article>
        </div>
      </section>
    </main>
  </body>
</html>
